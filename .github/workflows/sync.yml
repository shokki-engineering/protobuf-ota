name: Sync

# Proves protobuf/ is exactly what the pinned publications produce.
#
# Its own workflow because it is the repository's central claim -- nothing
# under protobuf/ is written by hand (CLAUDE.md rule 2) -- and because a stale
# tree is a different failure from a lint error: the fix is to run
# `just sync` and commit, never to edit the file the job complains about.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  Sync:
    name: Generated Tree Is Current
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"

      - name: Setup Buf
        uses: bufbuild/buf-action@v1
        with:
          setup_only: true

      - name: Regenerate
        run: |
          go run ./sync/cmd/sync
          buf format -w

      # A diff here means someone edited an emitted file, or changed the
      # generator without regenerating. The next `just sync` would silently
      # revert the first, so both are caught now.
      - name: Check For Drift
        run: |
          git add -N protobuf/ codes.lock
          git diff --exit-code -- protobuf/ codes.lock || {
            echo "::error::protobuf/ is stale or was hand-edited."
            echo "Run 'just sync' and commit the result; do not edit generated files."
            exit 1
          }
          echo "protobuf/ matches the pinned publications."
