version: v2
# A schema-only module. Consumers depend on it and run their own codegen, which
# is why no file carries a go_package. See buf.gen.yaml.
#
# The module is rooted at the repository root, not at protobuf/, so that
# protobuf/ is itself the first package segment:
# protobuf/opentravel/hotel/revenue/rate_plan/v1 resolves to package
# protobuf.opentravel.hotel.revenue.rate_plan.v1 and PACKAGE_DIRECTORY_MATCH
# holds without a redundant directory inside it.
modules:
  - path: .
    name: buf.build/shokki-engineering/protobuf-ota
    excludes:
      # modules/ holds the OpenTravel-Specifications checkout. It ships no
      # .proto today, but anything it ever vendored would enter this module
      # silently and be linted against rules it was never written for.
      - modules
      # build/ is reserved for exported dependency trees, as in coversa.
      - build
deps:
  - buf.build/bufbuild/protovalidate
  - buf.build/googleapis/googleapis
lint:
  # BASIC, not STANDARD, and no exception list.
  #
  # buf and api-linter overlap on API design, and where they overlap they
  # contradict: buf STANDARD wants HotelsService and GetHotelResponse
  # wrappers, AIP-131 wants Hotels returning Hotel. Rather than except
  # individual rules, the two tools are given non-overlapping jobs. buf BASIC
  # checks structure -- package/directory agreement, one package per
  # directory, import hygiene, casing. api-linter is the sole authority on API
  # design.
  #
  # Every rule in the selected category is enforced. Nothing is excepted.
  use:
    - BASIC
breaking:
  use:
    - FILE
