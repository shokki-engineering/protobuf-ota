# api-linter configuration. The file is a list of rule blocks.
# Each block's included_paths / excluded_paths decide which protos it governs,
# relative to this file's directory.
# https://linter.aip.dev/configuration
---
- included_paths:
    - "**/*.proto"
  disabled_rules: []

