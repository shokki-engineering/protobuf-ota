    string pseudo_city_code = 1 [
      (google.api.field_behavior) = OPTIONAL,
      (buf.validate.field).string = {
        min_len: 1
        max_len: 16
      },
      (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
      (protobuf.opentravel.annotations.v1.property) = {
        kind: KIND_ATTRIBUTE
        path: "QueueGroup/@PseudoCityCode"
      }
    ];

    // An identifier specifying the queue on which the booking file resides in
    // the system.
    //
    // OTA: QueueGroup/@QueueNumber.
    string queue_number = 2 [
      (google.api.field_behavior) = OPTIONAL,
      (buf.validate.field).string = {pattern: "^[0-9a-zA-Z]{1,8}$"},
      (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
      (protobuf.opentravel.annotations.v1.property) = {
        kind: KIND_ATTRIBUTE
        path: "QueueGroup/@QueueNumber"
      }
    ];

    // The category of the queue.
    //
    // OTA: QueueGroup/@QueueCategory.
    string queue_category = 3 [
      (google.api.field_behavior) = OPTIONAL,
      (buf.validate.field).string = {pattern: "^[0-9a-zA-Z]{1,8}$"},
      (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
      (protobuf.opentravel.annotations.v1.property) = {
        kind: KIND_ATTRIBUTE
        path: "QueueGroup/@QueueCategory"
      }
    ];

    // Identifies the airline and/or system where the queue resides. If this is
    // omitted, the airline and/or system code (AirlineVendorID) contained in
    // the point of sale information should be used.
    //
    // OTA: QueueGroup/@SystemCode.
    string system_code = 4 [
      (google.api.field_behavior) = OPTIONAL,
      (buf.validate.field).string = {
        min_len: 1
        max_len: 8
      },
      (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
      (protobuf.opentravel.annotations.v1.property) = {
        kind: KIND_ATTRIBUTE
        path: "QueueGroup/@SystemCode"
      }
    ];

    // An additional identifier to determine the exact queue on which a
    // reservation record should be placed.
    //
    // OTA: QueueGroup/@QueueID.
    string queue_id = 5 [
      (google.api.field_behavior) = OPTIONAL,
      (buf.validate.field).string = {pattern: "^[0-9a-zA-Z]{1,8}$"},
      (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
      (protobuf.opentravel.annotations.v1.property) = {
        kind: KIND_ATTRIBUTE
