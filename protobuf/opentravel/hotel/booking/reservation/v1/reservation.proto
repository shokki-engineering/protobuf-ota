  // Information to specify the queue on which the reservation should be placed.
  message Queue {
    option (protobuf.opentravel.annotations.v1.element) = {path: "HotelReservationType/Queue"};

    // The ATA/ IATA airport/city code, office code, pseudo city code, etc. of
    // the queue.
    //
