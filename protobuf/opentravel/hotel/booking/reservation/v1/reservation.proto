  // The state of the Reservation: OTA's ResStatus values that are states,
  // merged from the enumerations its type unites.
  enum State {
    option (protobuf.opentravel.annotations.v1.enumeration) = {xsd_type: "HotelReservationType/@ResStatus"};

    // Not specified.
    STATE_UNSPECIFIED = 0;

    // The reservation has been reserved.
    STATE_RESERVED = 1 [(protobuf.opentravel.annotations.v1.value) = {source_spelling: "Reserved"}];

    // The reservation has been requested but has not yet been reserved.
    STATE_REQUESTED = 2 [(protobuf.opentravel.annotations.v1.value) = {source_spelling: "Requested"}];

    // The request for the reservation has been denied.
    STATE_REQUEST_DENIED = 3 [(protobuf.opentravel.annotations.v1.value) = {source_spelling: "Request denied"}];

    // This reservation is in "no show" status. Typically this means the person
    // for whom this reservation belonged did not check in and the reservation
    // was moved to "no show" status.
    STATE_NO_SHOW = 4 [(protobuf.opentravel.annotations.v1.value) = {source_spelling: "No-show"}];

    // This reservation has been cancelled.
    STATE_CANCELLED = 5 [(protobuf.opentravel.annotations.v1.value) = {source_spelling: "Cancelled"}];

    // This reservation has been check in, and is in "in-house" status.
    STATE_IN_HOUSE = 6 [(protobuf.opentravel.annotations.v1.value) = {source_spelling: "In-house"}];

    // The guest has checked out and the reservation has been changed to
    // "Checked out" status
    STATE_CHECKED_OUT = 7 [(protobuf.opentravel.annotations.v1.value) = {source_spelling: "Checked out"}];

    // This reservation is in waitlist status and the reservation has not been
    // confirmed.
    STATE_WAITLISTED = 8 [(protobuf.opentravel.annotations.v1.value) = {source_spelling: "Waitlisted"}];
  }
